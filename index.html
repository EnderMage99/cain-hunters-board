<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="An 1889 cork evidence board for tracking sins in a CAIN one-shot.">
<title>Sin Hunter's Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='13' r='9' fill='%23b3232c'/%3E%3Cpath d='M16 22 V31' stroke='%23888' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Caveat:wght@600&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>Sin Hunter's Board</b><small>Case notes &middot; Anno 1889</small></div>
    <div class="grp" aria-label="Pin up">
      <span class="grp-label">Pin up</span>
      <button class="btn" id="addNote" type="button">Note</button>
      <button class="btn" id="addCard" type="button">Index card</button>
      <button class="btn" id="addTg" type="button">Telegram</button>
      <button class="btn" id="addLabel" type="button">Heading</button>
      <button class="btn" id="addPhoto" type="button">Photograph&hellip;</button>
    </div>
    <div class="grp" aria-label="String">
      <span class="grp-label">String</span>
      <button class="btn" id="tie" type="button" aria-pressed="false">Tie string</button>
      <div id="swatches" role="radiogroup" aria-label="String colour" style="display:flex;gap:6px"></div>
    </div>
    <div class="grp" aria-label="View">
      <span class="grp-label">View</span>
      <button class="btn sq" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <button class="btn" id="zoomFit" type="button" title="Fit the board to the screen">100%</button>
      <button class="btn sq" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="zoomRoom" type="button" title="Zoom out to the whole room">Room</button>
    </div>
    <div class="grp" aria-label="Case file">
      <span class="grp-label">Case file</span>
      <button class="btn" id="exportPng" type="button">Export PNG</button>
      <button class="btn" id="saveFile" type="button">Save file</button>
      <button class="btn" id="openFile" type="button">Open file&hellip;</button>
      <button class="btn" id="clearBoard" type="button">Clear board</button>
    </div>
    <input id="photoInput" type="file" accept="image/*" multiple hidden>
    <input id="caseInput" type="file" accept=".json,.png,application/json,image/png" hidden>
  </div>
</header>

<main id="viewport">
  <div id="stage">
   <div id="scene">
    <div id="room" aria-hidden="true">
    <div class="wall"></div>
    <div class="cornice"></div><div class="rail"></div>
    <div class="dado"></div>
    <div class="floor"></div>
    <div class="win" id="winL" style="left:2620px;top:470px;width:1000px;height:2230px"><div class="frame"><div class="opening"><canvas></canvas><div class="glass"></div><div class="sash"></div></div></div><div class="sill"></div><div class="curtain l"></div><div class="curtain r"></div><div class="pelmet"></div></div>
    <div class="win" id="winR" style="left:8140px;top:470px;width:1000px;height:2230px"><div class="frame"><div class="opening"><canvas></canvas><div class="glass"></div><div class="sash"></div></div></div><div class="sill"></div><div class="curtain l"></div><div class="curtain r"></div><div class="pelmet"></div></div>
    <div class="hook" style="left:4580px"></div><div class="hook" style="left:7180px"></div>
    <div class="cord" style="left:4580px"></div><div class="cord" style="left:7180px"></div>
    <div class="pool" style="left:725px;top:3613px;width:577px"></div>
    <img class="prop" src="img/decor/vintage_grandfather_clock_01.png" alt="" style="left:700px;top:1434px;width:627px;height:2191px">
    <div class="pool" style="left:9731px;top:3613px;width:1861px"></div>
    <img class="prop" src="img/decor/vintage_cabinet_01.png" alt="" style="left:9650px;top:1389px;width:2023px;height:2236px">
    <img class="prop" src="img/decor/vintage_oil_lamp.png" alt="" style="left:9860px;top:1938px;width:220px;height:802px">
    <img class="prop" src="img/decor/book_encyclopedia_set_01.png" alt="" style="left:10300px;top:2502px;width:551px;height:238px">
    <img class="prop" src="img/decor/mantel_clock_01.png" alt="" style="left:11050px;top:2579px;width:343px;height:161px">
    <div class="pool" style="left:3938px;top:3628px;width:353px"></div>
    <img class="prop" src="img/decor/side_table_tall_01.png" alt="" style="left:3923px;top:2878px;width:384px;height:762px">
    <img class="prop" src="img/decor/marble_bust_01.png" alt="" style="left:3979px;top:2369px;width:273px;height:516px">
    <div class="pool" style="left:7375px;top:3638px;width:541px"></div>
    <img class="prop" src="img/decor/potted_plant_01.png" alt="" style="left:7351px;top:2313px;width:588px;height:1337px">
    <div class="pool" style="left:4623px;top:3628px;width:2513px"></div>
    <img class="prop" src="img/decor/sofa_03.png" alt="" style="left:4514px;top:2520px;width:2731px;height:1120px">
    <div class="pool" style="left:2454px;top:4018px;width:781px"></div>
    <img class="prop" src="img/decor/chinese_armchair.png" alt="" style="left:2420px;top:2441px;width:849px;height:1589px">
    <div class="pool" style="left:7756px;top:3988px;width:1289px"></div>
    <img class="prop" src="img/decor/round_wooden_table_01.png" alt="" style="left:7700px;top:2993px;width:1401px;height:1007px">
    <img class="prop" src="img/decor/tea_set_01.png" alt="" style="left:7941px;top:2837px;width:919px;height:166px">
    <div class="pool" style="left:1188px;top:4028px;width:883px"></div>
    <img class="prop" src="img/decor/treasure_chest.png" alt="" style="left:1150px;top:3420px;width:960px;height:620px">
    <img class="prop" src="img/decor/brass_candleholders.png" alt="" style="left:1103px;top:2595px;width:1054px;height:835px">
    <div class="pool" style="left:9994px;top:4058px;width:1479px"></div>
    <img class="prop" src="img/decor/vintage_suitcase.png" alt="" style="left:9930px;top:3501px;width:1608px;height:569px">
    <div class="light"></div>
    </div>
    <div id="board">
      <div class="fr-shadow"></div>
      <div class="fr t"></div><div class="fr b"></div><div class="fr l"></div><div class="fr r"></div>
      <div id="cork">
        <div id="items"></div>
        <svg id="strings" xmlns="http://www.w3.org/2000/svg" width="3000" height="1900" viewBox="0 0 3000 1900"></svg>
        <div id="strctl" hidden></div>
      </div>
    </div>
   </div>
  </div>
</main>

<div id="hint">Double-click a note to write on it. Drag to move. Press Tie string, then click two items to connect them.</div>
<div id="toast" role="status" hidden></div>

<script src="js/board.js"></script>
<script src="js/street.js"></script>
</body>
</html>
